<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>e-Barangay Disaster & Ayuda Portal</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>e-Barangay Portal</h1>
        <p>Disaster Emergency & Ayuda Management System</p>
      </header>

      <main class="container">
        <div class="layout-grid">

          <!-- Ayuda Application Form -->
          <section class="card">
            <h2>Resident Registration</h2>
            <form id="ayuda-form">
              <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="Enter your full name" />
              </div>

              <div class="form-group">
                <label for="prov-select">Province</label>
                <select id="prov-select" required>
                  <option value="">Select Province...</option>
                </select>
              </div>

              <div class="form-group">
                <label for="city-select">City / Municipality</label>
                <select id="city-select" required>
                  <option value="">Select City/Municipality...</option>
                </select>
              </div>

              <div class="form-group">
                <label for="monthly-income">Monthly Income (₱)</label>
                <input type="number" id="monthly-income" required placeholder="1000" />
              </div>

              <div class="form-group checkbox-group">
                <label><input type="checkbox" id="is-senior" /> Senior Citizen</label>
                <label><input type="checkbox" id="is-pwd" /> Person with Disability (PWD)</label>
              </div>

              <div class="form-group">
                <label for="dependent-count">Number of Dependents</label>
                <input type="number" id="dependent-count" value="0" min="0" />
              </div>

              <button type="submit" class="btn primary">Evaluate & Register</button>
            </form>
          </section>

          <!-- Right column: Relief Packer + Registered Queue -->
          <div class="side-column">

            <section class="card">
              <h2>Relief Package POS Register</h2>
              <div id="eligibility-notice" class="empty-state" style="display: none;"></div>
              <div id="pos-wrapper" style="display: none;">
                <div id="pos-container"></div>
                <div id="catalog-container" class="catalog-grid" style="margin-top: 1rem;"></div>
              </div>
            </section>

            <section class="card">
              <h2>Registered Queue</h2>
              <div id="queue-container">
                <!-- Resident cards render here -->
              </div>
            </section>

          </div>

        </div>
      </main>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
